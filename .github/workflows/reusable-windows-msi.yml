name: Reusable Windows MSI

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  build:
    name: zip installer
    timeout-minutes: 60
    runs-on: windows-2022
    env:
      ARCH: x64
      IncludeFreethreaded: false
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Get External
      run:  ./PCbuild/get_externals.bat
      shell: bash
    - name: Build CPython installer
      run:  ./Tools/msi/buildrelease.bat -"${ARCH}" --skip-doc --skip-msi --skip-nuget
      shell: bash
    - name: Find built installer
      run: dir ./PCBuild/
      shell: bash
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-zip
        path: ./PCBuild/amd64/en-us/
